<!doctype html>
<html lang="cs" class="dark" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#020617" />
    <title>SDC</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sdc_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (ev) {
            var src = String((ev && ev.filename) || '');
            var msg = String((ev && ev.message) || '');
            if (src.indexOf('/assets/') === -1 && msg.indexOf('MIME') === -1 && msg.indexOf('module script') === -1) {
              return;
            }
            var n = 0;
            try {
              n = Number(sessionStorage.getItem('sdc_stale_asset_recoveries') || 0);
            } catch (err) {}
            if (n >= 2) {
              var boot = document.getElementById('sdc-boot');
              if (boot) {
                boot.innerHTML =
                  '<p style="margin:0 0 12px">Aplikace se nenačetla. Načtěte stránku znovu.</p><button type="button" onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:12px;background:#059669;color:#fff;font-weight:800">Načíst znovu</button>';
              }
              return;
            }
            try {
              sessionStorage.setItem('sdc_stale_asset_recoveries', String(n + 1));
            } catch (err) {}
            var reload = function () {
              location.reload();
            };
            if (n >= 1 && navigator.serviceWorker) {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
                .then(reload)
                .catch(reload);
              return;
            }
            reload();
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="sdc-boot" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030712;color:#34d399;font-family:sans-serif;gap:12px">
        <div style="width:64px;height:64px;border-radius:999px;background:#059669;display:flex;align-items:center;justify-content:center;color:#022c22;font-weight:900;letter-spacing:.12em">SDC</div>
        <p style="margin:0;letter-spacing:.35em;font-size:12px;font-weight:700">NAČÍTÁNÍ</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
