name: Build Android TWA (API 36)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'simple-dart-counter/android-twa/**'
      - '.github/workflows/android-twa-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple-dart-counter/android-twa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simple-dart-counter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: simple-dart-counter

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF

      - name: Restore signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Build Android App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx bubblewrap build --skipPwaValidation

      - name: Verify target SDK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2 dump badging app-release-signed.apk | rg "targetSdkVersion"
          test "$( $ANDROID_SDK_ROOT/build-tools/36.1.0/aapt2 dump badging app-release-signed.apk | rg -o "targetSdkVersion:'[0-9]+'" | rg -o "[0-9]+" )" = "36"

      - name: Upload AAB artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: simple-dart-counter-aab
          path: simple-dart-counter/android-twa/app-release-bundle.aab

      - name: Skip build without keystore
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ANDROID_KEYSTORE_BASE64 secret is not configured."
          echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD to build signed releases in CI."
