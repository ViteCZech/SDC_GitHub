name: Update CSO Rankings

on:
  schedule:
    # Každý den v 7:00 SEČ (5:00 UTC v zimním čase, 6:00 UTC v letním)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simple-dart-counter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: simple-dart-counter

      - name: Fetch rankings from Stedar
        id: fetch
        run: npm run update-rankings
        working-directory: simple-dart-counter

      - name: Log ranking meta
        if: success()
        run: |
          echo "Men:" && node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/cso-ranking-men.json','utf8')).meta)"
          echo "Women:" && node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/cso-ranking-women.json','utf8')).meta)"
          echo "Doubles:" && node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/cso-ranking-doubles.json','utf8')).meta)"
        working-directory: simple-dart-counter

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple-dart-counter/public/data/cso-ranking-men.json simple-dart-counter/public/data/cso-ranking-women.json simple-dart-counter/public/data/cso-ranking-doubles.json
          if git diff --staged --quiet; then
            echo "No ranking changes to commit (data unchanged or same as Stedar)."
          else
            git commit -m "chore: update CSO rankings from Stedar"
            git push
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::CSO ranking update failed. Check Stedar availability or HTML structure (#rankingsTable)."
          echo "Production app uses Cloud Function updateCsoRankingsScheduled (Firestore) as primary source."
